name: 'Bino CLI'
description: 'Install and run bino-cli for linting and building reports'
author: 'bino-bi'

branding:
  icon: 'file-text'
  color: 'blue'

inputs:
  version:
    description: 'bino-cli release to install, e.g. "v0.120.0". "latest" works, but the build is then not reproducible.'
    required: false
    default: 'latest'

  command:
    description: 'Command to run: "lint", "build", or "both"'
    required: true

  work-dir:
    description: 'Working directory containing report manifests'
    required: false
    default: '.'

  cache:
    description: 'Cache the bino binary, Chrome headless shell and template engine between runs'
    required: false
    default: 'true'

  engine-version:
    description: 'Template engine version to install for build, e.g. "v1.0.0-next.87". Leave it empty when bino.toml pins engine-version; bino build then downloads that one.'
    required: false
    default: ''

  registry-install:
    description: 'Run "bino registry install" before lint and build when the work dir has a bino.lock'
    required: false
    default: 'true'

  # Lint-specific inputs
  fail-on-warnings:
    description: 'Exit with non-zero code if lint warnings are found'
    required: false
    default: 'true'

  execute-queries:
    description: 'Execute dataset queries during lint to validate data'
    required: false
    default: 'false'

  # Build-specific inputs
  out-dir:
    description: 'Output directory for build artifacts and log files (relative to work-dir)'
    required: false
    default: 'dist'

  artefacts:
    description: 'Comma-separated list of artefact names to build (empty for all)'
    required: false
    default: ''

  exclude-artefacts:
    description: 'Comma-separated list of artefact names to exclude from build'
    required: false
    default: ''

  data-validation:
    description: 'Data validation mode: fail, warn, or off'
    required: false
    default: 'warn'

  log-format:
    description: 'Format of the lint and build log files: text or json'
    required: false
    default: 'text'

  no-lint:
    description: 'Skip lint during build'
    required: false
    default: 'false'

outputs:
  version:
    description: 'Installed bino-cli version'
    value: ${{ steps.install.outputs.version }}

  lint-log:
    description: 'Path to lint log file (if lint was run)'
    value: ${{ steps.lint.outputs.log-file }}

  build-log:
    description: 'Path to build log file (if build was run)'
    value: ${{ steps.build.outputs.log-file }}

  cache-hit:
    description: 'Whether the cache was hit'
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Resolve bino version
      id: resolve
      shell: bash
      env:
        BINO_VERSION: ${{ inputs.version }}
        COMMAND: ${{ inputs.command }}
      run: |
        case "$COMMAND" in
          lint|build|both) ;;
          *) echo "::error::command must be lint, build or both, got '$COMMAND'"; exit 1 ;;
        esac
        case "$RUNNER_OS" in
          Linux|macOS) ;;
          *) echo "::error::this action supports Linux and macOS runners only"; exit 1 ;;
        esac

        if [ -z "$BINO_VERSION" ] || [ "$BINO_VERSION" = "latest" ]; then
          URL=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/bino-bi/bino-cli-releases/releases/latest)
          TAG="${URL##*/}"
          echo "::warning title=bino version not pinned::version is 'latest' and resolved to $TAG. The next bino release can change this build. Pin it for a reproducible build: 'version: $TAG'."
        else
          TAG="v${BINO_VERSION#v}"
        fi

        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "Using bino $TAG"

    - name: Restore cache
      id: cache
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache@v4
      with:
        path: |
          ~/.local/bin/bino
          ~/.bino/chrome-headless-shell
          ~/.bino/cdn
        key: bino-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.tag }}-${{ inputs.command }}-${{ inputs.engine-version }}

    - name: Install bino-cli
      id: install
      shell: bash
      env:
        TAG: ${{ steps.resolve.outputs.tag }}
      run: |
        echo "::group::Installing bino-cli $TAG"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        # CI=1 turns off bino's update check.
        echo "CI=1" >> "$GITHUB_ENV"
        export PATH="$HOME/.local/bin:$PATH" CI=1

        if [ -x "$HOME/.local/bin/bino" ] && bino version | grep -q "^bino ${TAG#v} "; then
          echo "bino $TAG restored from cache"
        else
          case "$RUNNER_ARCH" in
            X64) ARCH=x86_64 ;;
            ARM64) ARCH=arm64 ;;
            *) echo "::error::unsupported runner architecture $RUNNER_ARCH"; exit 1 ;;
          esac
          OS=Linux
          if [ "$RUNNER_OS" = "macOS" ]; then OS=Darwin; fi
          ASSET="bino-cli_${OS}_${ARCH}.tar.gz"
          BASE="https://github.com/bino-bi/bino-cli-releases/releases/download/$TAG"
          TMP=$(mktemp -d)

          curl -fsSL -o "$TMP/$ASSET" "$BASE/$ASSET"
          curl -fsSL -o "$TMP/checksums.txt" "$BASE/checksums.txt"
          EXPECTED=$(awk -v a="$ASSET" '$2 == a {print $1}' "$TMP/checksums.txt")
          if [ -z "$EXPECTED" ]; then
            echo "::error::$ASSET is not listed in checksums.txt of $TAG"; exit 1
          fi
          if command -v sha256sum >/dev/null; then
            ACTUAL=$(sha256sum "$TMP/$ASSET" | awk '{print $1}')
          else
            ACTUAL=$(shasum -a 256 "$TMP/$ASSET" | awk '{print $1}')
          fi
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::checksum mismatch for $ASSET (expected $EXPECTED, got $ACTUAL)"; exit 1
          fi

          tar -xzf "$TMP/$ASSET" -C "$TMP"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$TMP/bino" "$HOME/.local/bin/bino"
          rm -rf "$TMP"
        fi

        INSTALLED=$(bino version | head -n1)
        echo "version=$INSTALLED" >> "$GITHUB_OUTPUT"
        echo "Installed: $INSTALLED"
        echo "::endgroup::"

    - name: Set up Chrome and template engine
      if: ${{ inputs.command == 'build' || inputs.command == 'both' }}
      shell: bash
      env:
        ENGINE_VERSION: ${{ inputs.engine-version }}
        WORK_DIR: ${{ inputs.work-dir }}
      run: |
        echo "::group::Setting up Chrome and template engine"
        bino setup --quiet
        # A pin in bino.toml is downloaded by bino build itself. Without any pin,
        # "bino setup --template-engine" would pick an old, incompatible engine.
        if [ -n "$ENGINE_VERSION" ]; then
          bino setup --quiet --template-engine --engine-version "$ENGINE_VERSION"
        elif ! grep -Eq '^[[:space:]]*engine-version[[:space:]]*=' "$WORK_DIR/bino.toml" 2>/dev/null; then
          echo "::warning title=template engine not pinned::$WORK_DIR/bino.toml has no engine-version. Pin it there (for example engine-version = \"v1.0.0-next.88\") or set the engine-version input."
        fi
        echo "::endgroup::"

    - name: Install registry packages
      if: ${{ inputs.registry-install == 'true' && hashFiles(format('{0}/bino.lock', inputs.work-dir)) != '' }}
      shell: bash
      working-directory: ${{ inputs.work-dir }}
      run: |
        echo "::group::Running bino registry install"
        bino registry install
        echo "::endgroup::"

    - name: Run lint
      id: lint
      if: ${{ inputs.command == 'lint' || inputs.command == 'both' }}
      shell: bash
      env:
        WORK_DIR: ${{ inputs.work-dir }}
        FAIL_ON_WARNINGS: ${{ inputs.fail-on-warnings }}
        EXECUTE_QUERIES: ${{ inputs.execute-queries }}
        LOG_FORMAT: ${{ inputs.log-format }}
        OUT_DIR: ${{ inputs.out-dir }}
      run: |
        echo "::group::Running bino lint"
        ARGS=(lint --work-dir "$WORK_DIR" --out-dir "$OUT_DIR" --lint-log-format "$LOG_FORMAT")
        if [ "$FAIL_ON_WARNINGS" = "true" ]; then ARGS+=(--fail-on-warnings); fi
        if [ "$EXECUTE_QUERIES" = "true" ]; then ARGS+=(--execute-queries); fi

        echo "Executing: bino ${ARGS[*]}"
        MARK=$(mktemp)
        STATUS=0
        bino "${ARGS[@]}" || STATUS=$?

        EXT=log
        if [ "$LOG_FORMAT" = "json" ]; then EXT=json; fi
        LOG_FILE=$(find "$WORK_DIR/$OUT_DIR" -maxdepth 1 -name "bino-lint-*.$EXT" -newer "$MARK" 2>/dev/null | head -n1 || true)
        rm -f "$MARK"
        echo "log-file=$LOG_FILE" >> "$GITHUB_OUTPUT"
        echo "::endgroup::"
        exit $STATUS

    - name: Run build
      id: build
      if: ${{ inputs.command == 'build' || inputs.command == 'both' }}
      shell: bash
      env:
        WORK_DIR: ${{ inputs.work-dir }}
        OUT_DIR: ${{ inputs.out-dir }}
        ARTEFACTS: ${{ inputs.artefacts }}
        EXCLUDE_ARTEFACTS: ${{ inputs.exclude-artefacts }}
        DATA_VALIDATION: ${{ inputs.data-validation }}
        LOG_FORMAT: ${{ inputs.log-format }}
        NO_LINT: ${{ inputs.no-lint }}
      run: |
        echo "::group::Running bino build"
        ARGS=(build --work-dir "$WORK_DIR" --out-dir "$OUT_DIR" --data-validation "$DATA_VALIDATION" --build-log-format "$LOG_FORMAT")

        IFS=',' read -ra LIST <<< "$ARTEFACTS"
        for a in "${LIST[@]}"; do
          a=$(echo "$a" | xargs)
          if [ -n "$a" ]; then ARGS+=(--artefact "$a"); fi
        done
        IFS=',' read -ra LIST <<< "$EXCLUDE_ARTEFACTS"
        for a in "${LIST[@]}"; do
          a=$(echo "$a" | xargs)
          if [ -n "$a" ]; then ARGS+=(--exclude-artefact "$a"); fi
        done
        if [ "$NO_LINT" = "true" ]; then ARGS+=(--no-lint); fi

        echo "Executing: bino ${ARGS[*]}"
        MARK=$(mktemp)
        STATUS=0
        bino "${ARGS[@]}" || STATUS=$?

        EXT=log
        if [ "$LOG_FORMAT" = "json" ]; then EXT=json; fi
        LOG_FILE=$(find "$WORK_DIR/$OUT_DIR" -maxdepth 1 -name "bino-build-*.$EXT" -newer "$MARK" 2>/dev/null | head -n1 || true)
        rm -f "$MARK"
        echo "log-file=$LOG_FILE" >> "$GITHUB_OUTPUT"
        echo "::endgroup::"
        exit $STATUS
